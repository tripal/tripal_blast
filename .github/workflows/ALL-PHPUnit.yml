
name: PHPUnit Full Test Suite
on:
  push:
    branches-ignore:
      - 4.x
  # Allows us to manually trigger this workflow.
  # This is great if there is a change made to Tripal core that we want to test our modules on ASAP.
  workflow_dispatch:

env:
  PKG_NAME: tripal_blast
  MODULES: "tripal_blast"

jobs:
  run-tests:
    name: "Drupal ${{ matrix.drupal-version }} - PHP ${{ matrix.php-version }} - PostgreSQL ${{ matrix.pgsql-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        pgsql-version:
          - "14"
          - "18"
        drupal-version:
          - "10.5.x"
          - "10.6.x"
          - "11.2.x"
          - "11.3.x"
          - "11.x-dev"
        exclude:
          # Only Drupal 11.3+ supports PHP 8.5.
          - php-version: "8.5"
            drupal-version: "10.5.x"
          - php-version: "8.5"
            drupal-version: "10.6.x"
          - php-version: "8.5"
            drupal-version: "11.2.x"
          # Drupal 11+ requires at least Postgresql 16.
          - pgsql-version: "14"
            drupal-version: "11.2.x"
          - pgsql-version: "14"
            drupal-version: "11.3.x"
          # Exclude higher postgresql version from middle Drupal versions
          - pgsql-version: "18"
            drupal-version: "10.6.x"
          # Drupal 11+ requires at least php 8.3.
          - php-version: "8.2"
            drupal-version: "11.2.x"
          - php-version: "8.2"
            drupal-version: "11.3.x"
          # Only run 11.x on the bleeding edge.
          - php-version: "8.2"
            drupal-version: "11.x-dev"
          - php-version: "8.3"
            drupal-version: "11.x-dev"
          - php-version: "8.4"
            drupal-version: "11.x-dev"
          - pgsql-version: "14"
            drupal-version: "11.x-dev"

    steps:
      # Check out the repo
      - name: Checkout Repository
        uses: actions/checkout@v6
      # Here we pull the development tripaldocker image for this combo in our matrix
      - name: Run Automated testing
        uses: tripal/test-tripal-action@v1.8
        with:
          directory-name: $PKG_NAME
          modules: $MODULES
          build-image: TRUE
          dockerfile: 'Dockerfile'
          php-version: ${{ matrix.php-version }}
          pgsql-version: ${{ matrix.pgsql-version }}
          drupal-version: ${{ matrix.drupal-version }}
